# Keeps the SHA-pinned actions and the locked dependencies current. The cooldown matches
# uv's `exclude-newer = "2 weeks"`: no update is proposed for a release younger than that.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
    groups:
      python:
        patterns: ["*"]
