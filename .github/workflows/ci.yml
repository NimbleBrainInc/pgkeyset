name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# A newer push to a pull request supersedes its older run; every run on main finishes, so each
# merged commit keeps its own result.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Format, lint and types once, on the newest Python.
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.13"
      - run: uv sync --locked
      - run: uv run ruff format --check src tests
      - run: uv run ruff check src tests
      - run: uv run ty check src tests

  # The suites against a real Postgres, as a superuser that creates a throwaway database for the
  # walk tests. CI=true turns a missing database into a failure, not a skip.
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13", "3.14"]
        postgres: ["14", "17"]
    services:
      postgres:
        image: postgres:${{ matrix.postgres }}-alpine
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 25
    env:
      PGKEYSET_TEST_URL: postgresql+asyncpg://postgres@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: ${{ matrix.python }}
      - run: uv sync --locked
      - run: uv run pytest -q

  # The suite with every direct dependency at the lowest version pyproject.toml allows, so a
  # declared floor is one the code actually works on. Resolves fresh, ignoring uv.lock.
  lowest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 25
    env:
      PGKEYSET_TEST_URL: postgresql+asyncpg://postgres@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.12"
      - run: uv sync --resolution lowest-direct
      - run: uv run --no-sync pytest -q

  # The distributions build and their metadata is valid on every change, not first at release.
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.13"
      - run: uv build
      - run: uvx --from "twine==7.0.0" twine check --strict dist/*
      - name: The wheel installs, imports, and reports its own version
        run: |
          version=$(uv version --short)
          uv run --isolated --no-project --with dist/*.whl python -c "import pgkeyset, sys; assert pgkeyset.__version__ == sys.argv[1], pgkeyset.__version__" "$version"

  # One required check that stands for the jobs above, so branch rules need not list each cell.
  verify:
    if: always()
    needs: [check, test, lowest, build]
    runs-on: ubuntu-latest
    steps:
      - run: |
          test "${{ needs.check.result }}" = success
          test "${{ needs.test.result }}" = success
          test "${{ needs.lowest.result }}" = success
          test "${{ needs.build.result }}" = success
