name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Format, lint and types once, on the newest Python.
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          python-version: "3.13"
      - run: uv sync --locked
      - run: uv run ruff format --check src tests
      - run: uv run ruff check src tests
      - run: uv run ty check src tests

  # The suites against a real Postgres, as a superuser that creates a throwaway database for the
  # walk tests. CI=true turns a missing database into a failure, not a skip.
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13"]
        postgres: ["14", "17"]
    services:
      postgres:
        image: postgres:${{ matrix.postgres }}-alpine
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 25
    env:
      PGKEYSET_TEST_URL: postgresql+asyncpg://postgres@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          python-version: ${{ matrix.python }}
      - run: uv sync --locked
      - run: uv run pytest -q

  # One required check that stands for the matrix, so branch rules need not list each cell.
  verify:
    if: always()
    needs: [check, test]
    runs-on: ubuntu-latest
    steps:
      - run: test "${{ needs.check.result }}" = success && test "${{ needs.test.result }}" = success
